  const [gasId,setGasId]=React.useState('R410A');
  const [tevap,setTevap]=React.useState(-10);
  const [tcond,setTcond]=React.useState(40);
  const [sh,setSh]=React.useState(5);
  const [sc,setSc]=React.useState(5);
  const [showInfo,setShowInfo]=React.useState(false);

  const gasObj=GASES[gasId]||GASES['R410A'];
  const md=MOLLIER_H[gasId]||MOLLIER_H['R410A'];
  const ptArr=gasObj.ptData||[];

  // Saturation pressures from ptData (array of [t, p] pairs)
  const getPsat=(t)=>{
    if(ptArr.length===0) return 1;
    if(t<=ptArr[0][0]) return ptArr[0][1];
    if(t>=ptArr[ptArr.length-1][0]) return ptArr[ptArr.length-1][1];
    for(let i=0;i<ptArr.length-1;i++){
      if(t>=ptArr[i][0]&&t<=ptArr[i+1][0]){
        const f=(t-ptArr[i][0])/(ptArr[i+1][0]-ptArr[i][0]);
        return ptArr[i][1]+f*(ptArr[i+1][1]-ptArr[i][1]);
      }
    }
    return ptArr[ptArr.length-1][1];
  };

  const pEvap=Math.max(0.1,getPsat(tevap));
  const pCond=Math.max(0.1,getPsat(tcond));

  // State points
  const T1=tevap+sh;
  const T3=tcond-sc;
  const h1=md.hV0+md.Cv*T1;
  const h3=md.hL0+md.Cl*T3;
  const h4=h3;
  const rc=pCond/pEvap;
  const T2=(T1+273.15)*Math.pow(rc,0.13)-273.15;
  const h2=md.hV0+md.Cv*T2;
  const qEvap=h1-h4;
  const wComp=h2-h1;
  const qCond=h2-h3;
  const COP_c=wComp>0?qEvap/wComp:0;
  const COP_h=wComp>0?qCond/wComp:0;

  // Chart layout
  const CL=58,CR=368,CT=28,CB=316;
  const W=400,H=370;

  // Axis bounds
  const hVals=[h1,h2,h3,h4];
  const hMin=Math.max(100,Math.min(...hVals)-60);
  const hMax=Math.min(md.hV0+200,Math.max(...hVals)+60);
  const pMin=Math.max(0.05,pEvap*0.5);
  const pMax=pCond*2.5;

  const hRange=hMax-hMin||1;
  const pLogRange=(Math.log10(pMax)-Math.log10(pMin))||1;
  const tX=h=>CL+(h-hMin)/hRange*(CR-CL);
  const tY=p=>CB-(Math.log10(Math.max(0.001,p))-Math.log10(pMin))/pLogRange*(CB-CT);

  // Build saturation dome from ptData
  const domePoints=[];
  for(let i=0;i<ptArr.length;i++){
    const t=ptArr[i][0],p=ptArr[i][1];
    if(t<tevap-30||t>md.Tc) continue;
    const hL=md.hL0+md.Cl*t;
    const hV=md.hV0+md.Cv*t;
    if(isFinite(hL)&&isFinite(hV)&&p>0){
      domePoints.push({t,p,hL,hV});
    }
  }
  // Add critical point
  domePoints.push({t:md.Tc,p:md.Pc,hL:md.hc,hV:md.hc});
  domePoints.sort((a,b)=>a.t-b.t);

  const leftDome=domePoints.map(d=>`${tX(d.hL).toFixed(1)},${tY(d.p).toFixed(1)}`).join(' ');
  const rightDome=[...domePoints].reverse().map(d=>`${tX(d.hV).toFixed(1)},${tY(d.p).toFixed(1)}`).join(' ');
  const domePoly=[leftDome,rightDome].filter(Boolean).join(' ');

  const leftPath=domePoints.map((d,i)=>`${i===0?'M':'L'}${tX(d.hL).toFixed(1)},${tY(d.p).toFixed(1)}`).join(' ');
  const rightPath=[...domePoints].reverse().map((d,i)=>`${i===0?'M':'L'}${tX(d.hV).toFixed(1)},${tY(d.p).toFixed(1)}`).join(' ');

  // Cycle path coords
  const x1=tX(h1),y1=tY(pEvap);
  const x2=tX(h2),y2=tY(pCond);
  const x3=tX(h3),y3=tY(pCond);
  const x4=tX(h4),y4=tY(pEvap);

  // Y-axis pressure labels
  const pLabels=[0.1,0.2,0.5,1,2,5,10,20,50,100].filter(p=>p>=pMin*0.8&&p<=pMax*1.2);

  // X-axis enthalpy labels
  const hStep=50;
  const hStart=Math.ceil(hMin/hStep)*hStep;
  const hLabels=[];
  for(let h=hStart;h<=hMax;h+=hStep) hLabels.push(h);

  const c={blue:'#1B4F8A',red:'#e53935',green:'#43a047',orange:'#fb8c00',cyan:'#00bcd4',gray:'#9e9e9e'};

  return (
    <div style={{padding:'0 0 80px'}}>
      {/* Gas selector */}
      <div style={{padding:'12px 12px 6px',overflowX:'auto',display:'flex',gap:6,scrollbarWidth:'none'}}>
        {GAS_IDS.map(id=>(
          <button key={id} onClick={()=>setGasId(id)}
            style={{flexShrink:0,padding:'5px 10px',borderRadius:20,border:'none',
              background:id===gasId?c.blue:'var(--card)',
              color:id===gasId?'#fff':'var(--text)',
              fontSize:11,fontWeight:id===gasId?700:400,cursor:'pointer',
              boxShadow:id===gasId?'0 2px 8px rgba(27,79,138,0.3)':'none'}}>
            {id}
          </button>
        ))}
      </div>

      {/* Inputs */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,padding:'8px 12px'}}>
        {[['T Evap','tevap',tevap,setTevap,-40,20],
          ['T Cond','tcond',tcond,setTcond,25,70],
          ['SH °C','sh',sh,setSh,0,30],
          ['SC °C','sc',sc,setSc,0,20]].map(([lbl,_k,val,setter,mn,mx])=>(
          <div key={lbl} style={{background:'var(--card)',borderRadius:10,padding:'8px 10px',border:'1px solid var(--border)'}}>
            <div style={{fontSize:10,color:'var(--sub)',marginBottom:2}}>{lbl}</div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <input type="range" min={mn} max={mx} value={val}
                onChange={e=>setter(Number(e.target.value))}
                style={{flex:1,accentColor:c.blue}}/>
              <span style={{fontSize:12,fontWeight:700,color:c.blue,minWidth:30,textAlign:'right'}}>{val}°</span>
            </div>
          </div>
        ))}
      </div>

      {/* SVG Diagram */}
      <div style={{padding:'0 8px',overflowX:'auto'}}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block',maxWidth:460,margin:'0 auto'}}>
          {/* Background */}
          <rect x={CL} y={CT} width={CR-CL} height={CB-CT} fill="var(--bg)" opacity={0.5}/>

          {/* Grid lines */}
          {pLabels.map(p=>{
            const y=tY(p);
            if(y<CT||y>CB) return null;
            return <line key={p} x1={CL} y1={y} x2={CR} y2={y} stroke="var(--border)" strokeWidth={0.5}/>;
          })}
          {hLabels.map(h=>{
            const x=tX(h);
            if(x<CL||x>CR) return null;
            return <line key={h} x1={x} y1={CT} x2={x} y2={CB} stroke="var(--border)" strokeWidth={0.5}/>;
          })}

          {/* Saturation dome fill */}
          {domePoly&&<polygon points={domePoly} fill="rgba(27,79,138,0.08)" stroke="none"/>}

          {/* Dome lines */}
          {leftPath&&<path d={leftPath} fill="none" stroke={c.orange} strokeWidth={2} strokeLinejoin="round"/>}
          {rightPath&&<path d={rightPath} fill="none" stroke={c.blue} strokeWidth={2} strokeLinejoin="round"/>}

          {/* Critical point */}
          <circle cx={tX(md.hc)} cy={tY(md.Pc)} r={4} fill={c.blue} stroke="#fff" strokeWidth={1.5}/>

          {/* Cycle — evaporation (h4→h1 at pEvap) */}
          <line x1={x4} y1={y4} x2={x1} y2={y1} stroke={c.cyan} strokeWidth={2.5}/>
          {/* Cycle — compression (h1→h2) */}
          <path d={`M${x1},${y1} Q${x1+(x2-x1)*0.3},${y1-(y2-y1)*0.6} ${x2},${y2}`}
            fill="none" stroke={c.red} strokeWidth={2.5}/>
          {/* Cycle — condensation (h2→h3 at pCond) */}
          <line x1={x2} y1={y2} x2={x3} y2={y3} stroke={c.orange} strokeWidth={2.5}/>
          {/* Cycle — expansion (h3→h4 isenthalpic) */}
          <line x1={x3} y1={y3} x2={x4} y2={y4} stroke={c.cyan} strokeWidth={2} strokeDasharray="4 3"/>

          {/* State point circles */}
          {[['1',x1,y1,c.cyan,'1 — Aspiración'],[' 2',x2,y2,c.red,'2 — Descarga'],
            ['3',x3,y3,c.orange,'3 — Líquido sat.'],['4',x4,y4,c.cyan,'4 — Expansión']].map(([lbl,cx,cy,col])=>(
            <g key={lbl}>
              <circle cx={cx} cy={cy} r={5} fill={col} stroke="#fff" strokeWidth={1.5}/>
              <text x={cx+7} y={cy-5} fontSize={9} fill={col} fontWeight="bold">{lbl}</text>
            </g>
          ))}

          {/* Pressure lines */}
          <line x1={CL-2} y1={y1} x2={CL+4} y2={y1} stroke={c.cyan} strokeWidth={1.5}/>
          <line x1={CL-2} y1={y2} x2={CL+4} y2={y2} stroke={c.red} strokeWidth={1.5}/>

          {/* Y axis */}
          <line x1={CL} y1={CT} x2={CL} y2={CB} stroke="var(--text)" strokeWidth={1}/>
          {pLabels.map(p=>{
            const y=tY(p);
            if(y<CT-2||y>CB+2) return null;
            return (
              <g key={p}>
                <line x1={CL-3} y1={y} x2={CL} y2={y} stroke="var(--text)" strokeWidth={1}/>
                <text x={CL-5} y={y+3} fontSize={8} fill="var(--sub)" textAnchor="end">{p}</text>
              </g>
            );
          })}

          {/* X axis */}
          <line x1={CL} y1={CB} x2={CR} y2={CB} stroke="var(--text)" strokeWidth={1}/>
          {hLabels.map(h=>{
            const x=tX(h);
            if(x<CL||x>CR) return null;
            return (
              <g key={h}>
                <line x1={x} y1={CB} x2={x} y2={CB+3} stroke="var(--text)" strokeWidth={1}/>
                <text x={x} y={CB+11} fontSize={8} fill="var(--sub)" textAnchor="middle">{h}</text>
              </g>
            );
          })}

          {/* Axis labels */}
          <text x={CL-38} y={(CT+CB)/2} fontSize={9} fill="var(--sub)" textAnchor="middle"
            transform={`rotate(-90,${CL-38},${(CT+CB)/2})`}>P (bar)</text>
          <text x={(CL+CR)/2} y={H-4} fontSize={9} fill="var(--sub)" textAnchor="middle">h (kJ/kg)</text>

          {/* Zone labels */}
          <text x={CL+18} y={CT+16} fontSize={8} fill={c.orange} opacity={0.7}>Sub-enfriado</text>
          <text x={(CL+CR)/2-16} y={CT+14} fontSize={8} fill={c.blue} opacity={0.7} textAnchor="middle">Bifásico</text>
          <text x={CR-8} y={CT+16} fontSize={8} fill={c.gray} opacity={0.7} textAnchor="end">Vapor</text>

          {/* Gas name */}
          <text x={CR-4} y={CB-4} fontSize={11} fill={c.blue} fontWeight="bold" textAnchor="end" opacity={0.5}>{gasId}</text>
        </svg>
      </div>

      {/* Results panel */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,padding:'8px 12px'}}>
        {[
          ['P Evap',pEvap.toFixed(2),'bar',c.cyan],
          ['P Cond',pCond.toFixed(2),'bar',c.red],
          ['RC (r)',rc.toFixed(2),':1',c.orange],
          ['COP Frío',COP_c.toFixed(2),'',c.blue],
          ['COP Calor',COP_h.toFixed(2),'',c.green],
          ['W Compr',(h2-h1).toFixed(1),'kJ/kg',c.red],
          ['Q Evap',(h1-h4).toFixed(1),'kJ/kg',c.cyan],
          ['Q Cond',(h2-h3).toFixed(1),'kJ/kg',c.orange],
        ].map(([lbl,val,u,col])=>(
          <div key={lbl} style={{background:'var(--card)',borderRadius:10,padding:'8px 10px',
            border:`1px solid var(--border)`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:10,color:'var(--sub)'}}>{lbl}</span>
            <span style={{fontSize:13,fontWeight:700,color:col}}>{val}<span style={{fontSize:9,color:'var(--sub)',marginLeft:2}}>{u}</span></span>
          </div>
        ))}
      </div>

      {/* Enthalpy state points */}
      <div style={{margin:'4px 12px 8px',background:'var(--card)',borderRadius:12,padding:'10px 12px',border:'1px solid var(--border)'}}>
        <div style={{fontSize:10,color:'var(--sub)',marginBottom:6,fontWeight:600,letterSpacing:1}}>ENTALPÍAS (kJ/kg)</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
          {[['h₁ Aspiración',h1,c.cyan],['h₂ Descarga',h2,c.red],
            ['h₃ Líq. sat.',h3,c.orange],['h₄ Post-exp.',h4,c.cyan]].map(([lbl,val,col])=>(
            <div key={lbl} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:9,color:'var(--sub)'}}>{lbl}</span>
              <span style={{fontSize:12,fontWeight:700,color:col}}>{val.toFixed(1)}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Info toggle */}
      <div style={{margin:'0 12px 8px'}}>
        <button onClick={()=>setShowInfo(v=>!v)}
          style={{width:'100%',background:'var(--card)',border:'1px solid var(--border)',
            borderRadius:10,padding:'9px 12px',fontSize:11,color:'var(--text)',cursor:'pointer',
            display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>📖 ¿Cómo leer un diagrama P-h (Mollier)?</span>
          <span style={{color:c.blue,fontWeight:700}}>{showInfo?'▲':'▼'}</span>
        </button>
        {showInfo&&(
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderTop:'none',
            borderRadius:'0 0 10px 10px',padding:'12px',fontSize:11,color:'var(--text)',lineHeight:1.7}}>
            <div style={{marginBottom:8}}>
              El <strong>diagrama de Mollier</strong> (o diagrama P-h) es la herramienta fundamental del técnico
              de refrigeración. Representa el ciclo de refrigeración en un plano donde:
            </div>
            <div style={{marginBottom:8}}>
              <span style={{color:c.gray}}>→</span> <strong>Eje X:</strong> Entalpía específica <em>h</em> (kJ/kg) — energía contenida en el refrigerante<br/>
              <span style={{color:c.gray}}>→</span> <strong>Eje Y:</strong> Presión <em>P</em> (bar) en escala logarítmica
            </div>
            <div style={{fontWeight:600,color:c.blue,marginBottom:4,marginTop:8}}>La cúpula de saturación:</div>
            <div style={{marginBottom:8}}>
              Divide el diagrama en 3 zonas: <span style={{color:c.orange}}>líquido sub-enfriado</span> (izquierda),
              <span style={{color:c.blue}}> zona bifásica</span> (dentro de la cúpula) y
              <span style={{color:c.gray}}> vapor sobrecalentado</span> (derecha).
              El punto más alto es el <strong>punto crítico</strong>.
            </div>
            <div style={{fontWeight:600,color:c.blue,marginBottom:4,marginTop:8}}>El ciclo de refrigeración:</div>
            {[
              ['1→2',c.red,'Compresión','El compresor eleva la presión y temperatura del vapor (proceso adiabático)'],
              ['2→3',c.orange,'Condensación','El condensador extrae calor al ambiente. El refrigerante pasa a líquido (P constante)'],
              ['3→4',c.cyan,'Expansión','La válvula de expansión reduce la presión (h constante — línea vertical)'],
              ['4→1',c.cyan,'Evaporación','El evaporador absorbe calor del espacio a enfriar (P constante)'],
            ].map(([pts,col,nom,desc])=>(
              <div key={pts} style={{marginBottom:6,paddingLeft:8,borderLeft:`2px solid ${col}`}}>
                <span style={{color:col,fontWeight:700}}>{pts} {nom}: </span>{desc}
              </div>
            ))}
            <div style={{fontWeight:600,color:c.blue,marginBottom:4,marginTop:10}}>Fórmulas clave:</div>
            <div style={{fontFamily:'monospace',fontSize:10,background:'rgba(27,79,138,0.08)',
              borderRadius:8,padding:'8px 10px',lineHeight:1.9}}>
              <div>COP Frío = (h₁ - h₄) / (h₂ - h₁)</div>
              <div>COP Calor = (h₂ - h₃) / (h₂ - h₁)</div>
              <div>W Compresor = h₂ - h₁  [kJ/kg]</div>
              <div>Efecto frigorífico = h₁ - h₄  [kJ/kg]</div>
              <div>Calor condensación = h₂ - h₃  [kJ/kg]</div>
              <div>RC (razón de compresión) = P_cond / P_evap</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Main App (requires auth) ───────────────────────────────────────────────────
function MainApp({user,onLogout}){
  const [tab,setTab]=React.useState('gases');
  const [selectedGas,setSelectedGas]=React.useState(null);
  const [theme,setTheme]=React.useState(()=>getTheme());
  const [menuOpen,setMenuOpen]=React.useState(false);

  const doToggleTheme=()=>{
    const next=theme==='light'?'dark':'light';
    setTheme(next);
    localStorage.setItem('anton_theme',next);
    document.documentElement.setAttribute('data-theme',next);
  };

  const initials=(user?.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  if(selectedGas) return <GasDetail gas={selectedGas} onBack={()=>setSelectedGas(null)}/>;

  const navTabs=[
    ['gases','🧪','Gases'],['pt','📊','P-T'],['shsc','🌡️','SH/SC'],
    ['ciclo','🔧','Ciclo'],['mollier','📈','P-h'],['biblioteca','📁','Docs'],['carga','⚖️','Carga'],
    ['productos','🛒','Productos'],['comparar','↔️','Comparar'],['carnot','🔄','Carnot'],
    ['app','🔍','Aplicación'],['teoria','📚','Teoría'],
  ];

  return (
    <div className="app" onClick={()=>menuOpen&&setMenuOpen(false)}>
      <div className="header">
        <img src={LOGO_SRC}
          style={{height:30,width:'auto',flexShrink:0,filter:'brightness(0) invert(1)',objectFit:'contain'}}
          alt="Anton Company"/>
        <div style={{width:'1px',height:26,background:'rgba(255,255,255,0.2)',margin:'0 8px',flexShrink:0}}/>
        <div style={{flex:1}}>
          <div className="header-title" style={{fontSize:12}}>Guía Técnica de Gases</div>
          <div className="header-sub">{GAS_LIST.length} GASES</div>
        </div>
        <button className="theme-btn" onClick={e=>{e.stopPropagation();doToggleTheme();}} title="Tema">
          {theme==='dark'?'☀️':'🌙'}
        </button>
        <div style={{position:'relative',marginLeft:6}} onClick={e=>e.stopPropagation()}>
          <div className="user-avatar" onClick={()=>setMenuOpen(o=>!o)}>
            {initials}
          </div>
          {menuOpen&&(
            <div className="user-menu">
              <div className="user-menu-header">
                <div className="user-menu-name">{user?.name||'Usuario'}</div>
                <div className="user-menu-role">{user?.role||''}{user?.company?' · '+user.company:''}</div>
              </div>
              <button className="user-menu-item danger" onClick={()=>{setMenuOpen(false);onLogout();}}>
                🚪 Cerrar sesión
              </button>
            </div>
          )}
        </div>
      </div>
      <ErrorBoundary>
        {tab==='gases'     &&<GasListScreen onSelect={setSelectedGas}/>}
        {tab==='comparar'  &&<ComparisonScreen/>}
        {tab==='pt'        &&<SimulatorScreen/>}
        {tab==='shsc'      &&<SuperheatScreen/>}
        {tab==='ciclo'     &&<CicloScreen/>}
        {tab==='mollier'   &&<MollierScreen/>}
        {tab==='carnot'    &&<CarnotScreen/>}
        {tab==='app'       &&<AplicacionScreen/>}
        {tab==='teoria'    &&<TeoriaScreen/>}
        {tab==='biblioteca'&&<BibliotecaScreen/>}
        {tab==='carga'     &&<CargaScreen/>}
        {tab==='productos' &&<ProductosScreen/>}
      </ErrorBoundary>
      <nav className="nav">
        {navTabs.map(([id,ico,lbl])=>(
          <button key={id} className={`nav-item ${tab===id?'active':''}`} onClick={()=>setTab(id)}>
            <span className="nav-icon">{ico}</span>{lbl}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ── App Root with Auth ─────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=React.useState('splash');
  const [user,setUser]=React.useState(null);

  React.useEffect(()=>{
    try{
      const s=localStorage.getItem('anton_session');
      if(s){const u=JSON.parse(s);setUser(u);setScreen('app');}
      else{setTimeout(()=>setScreen('login'),2600);}
    }catch(e){setTimeout(()=>setScreen('login'),2600);}
  },[]);

  const handleLogin=(u)=>{
    try{localStorage.setItem('anton_session',JSON.stringify(u));}catch(e){}
    setUser(u);setScreen('app');
  };
  const handleLogout=()=>{
    try{localStorage.removeItem('anton_session');}catch(e){}
    setUser(null);setScreen('login');
  };

  if(screen==='splash') return <SplashScreen/>;
  if(screen==='login') return <LoginScreen onLogin={handleLogin} onRegister={()=>setScreen('register')}/>;
  if(screen==='register') return <RegisterScreen onBack={()=>setScreen('login')} onRegistered={handleLogin}/>;
  return <MainApp user={user} onLogout={handleLogout}/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[Anton] SW registrado:', reg.scope))
          .catch(err => console.warn('[Anton] SW error:', err));
      });
    }
  </script>
</body>
