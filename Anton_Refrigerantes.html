<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Anton Ref"/>
<meta name="theme-color" content="#1B4F8A"/>
<meta name="description" content="App técnica para refrigeración y aire acondicionado — Anton Company"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<title>Anton Refrigerantes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6fa;color:#1a2133;}

  :root{
    --anton:#1B4F8A; --anton-d:#163d6d; --anton-l:#e8eef8;
    --text:#1a2133; --sub:#6b7694; --border:#e4e8f2;
    --card:#fff; --bg:#f4f6fa; --radius:14px;
    --shadow:0 2px 12px rgba(27,79,138,0.07);
    --shadow-sm:0 1px 4px rgba(0,0,0,0.05);
  }

  /* ── App shell ── */
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

  /* ── Header ── */
  .header{background:linear-gradient(135deg,#1a4a80 0%,#1B4F8A 60%,#2266b0 100%);color:#fff;
    padding:16px 18px 14px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(27,79,138,0.25);}
  .header-title{font-size:17px;font-weight:700;letter-spacing:-0.2px;line-height:1.2;}
  .header-sub{font-size:11px;opacity:0.65;letter-spacing:0.5px;margin-top:1px;}
  .back-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;width:36px;height:36px;
    border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .back-btn:active{background:rgba(255,255,255,0.3);}

  /* ── Tab nav ── */
  .nav{display:flex;background:#fff;border-top:1px solid var(--border);
    position:sticky;bottom:0;z-index:100;overflow-x:auto;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav-item{flex:0 0 auto;min-width:56px;padding:8px 4px 6px;display:flex;flex-direction:column;
    align-items:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--sub);
    font-size:10px;font-weight:500;transition:color .18s;position:relative;}
  .nav-item.active{color:var(--anton);}
  .nav-item.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2.5px;
    background:var(--anton);border-radius:0 0 3px 3px;}
  .nav-icon{font-size:20px;line-height:1;}

  /* ── Content area ── */
  .content{flex:1;overflow-y:auto;padding-bottom:72px;}

  /* ── Search bar ── */
  .search-bar{padding:14px 16px 10px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0.4;pointer-events:none;}
  .search-input{width:100%;padding:10px 14px 10px 36px;border:1.5px solid var(--border);
    border-radius:22px;font-size:14px;background:#f8f9fc;outline:none;transition:border .2s;color:var(--text);}
  .search-input:focus{border-color:var(--anton);background:#fff;}

  /* ── Filter chips ── */
  .filter-row{display:flex;gap:7px;padding:10px 16px 8px;overflow-x:auto;scrollbar-width:none;background:#fff;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);
    background:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--sub);transition:all .18s;}
  .filter-chip.active{background:var(--anton);border-color:var(--anton);color:#fff;box-shadow:0 2px 8px rgba(27,79,138,0.25);}

  /* ── Category divider ── */
  .divider{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;
    letter-spacing:1px;padding:16px 16px 6px;display:flex;align-items:center;gap:8px;}
  .divider::after{content:'';flex:1;height:1px;background:var(--border);}

  /* ── Gas card ── */
  .gas-card{background:var(--card);margin:5px 12px;border-radius:var(--radius);
    padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;
    border:1.5px solid var(--border);box-shadow:var(--shadow-sm);transition:all .18s;}
  .gas-card:active,.gas-card:hover{border-color:var(--anton);box-shadow:0 4px 16px rgba(27,79,138,0.12);}

  /* ── Gas badge (category pill) ── */
  .gas-badge{min-width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;
    text-align:center;flex-shrink:0;line-height:1.3;gap:1px;letter-spacing:0.3px;}
  .gas-badge-id{font-size:13px;font-weight:900;line-height:1;}
  .badge-HFC{background:linear-gradient(145deg,#1B4F8A,#2266b0);}
  .badge-HFO{background:linear-gradient(145deg,#0a7e4f,#12a367);}
  .badge-Blend{background:linear-gradient(145deg,#7b3fa0,#9b52c8);}
  .badge-HC{background:linear-gradient(145deg,#b85c00,#d97200);}
  .badge-HCFC{background:linear-gradient(145deg,#888,#aaa);}

  .gas-info{flex:1;min-width:0;}
  .gas-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.2px;}
  .gas-anton{font-size:11px;color:var(--anton);font-weight:600;margin-top:1px;}
  .gas-desc{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
  .gas-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}

  /* ── GWP badge ── */
  .gwp-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:0.2px;}
  .gwp-low{background:#e0f5e9;color:#1a7a3a;}
  .gwp-mid{background:#fff3dc;color:#8a5500;}
  .gwp-high{background:#ffe6e6;color:#c0392b;}

  /* ── ASHRAE safety badge ── */
  .safety-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;}
  .safety-A1{background:#e0f5e9;color:#1a7a3a;}
  .safety-A2L{background:#fff3dc;color:#8a5500;}
  .safety-A3{background:#ffe6e6;color:#c0392b;}

  /* ── Gas Detail ── */
  .detail-hero{background:linear-gradient(145deg,#163d6d,#1B4F8A 50%,#2060a0);color:#fff;padding:20px 18px 26px;}
  .detail-name{font-size:28px;font-weight:900;letter-spacing:-0.8px;}
  .detail-sub{font-size:13px;opacity:0.65;margin-top:4px;letter-spacing:0.2px;}
  .detail-anton-badge{display:inline-block;background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);
    padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px;letter-spacing:0.3px;}
  .chips-row{display:flex;flex-wrap:wrap;gap:7px;padding:14px 14px 6px;}
  .chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .chip-green{background:#e0f5e9;color:#1a7a3a;}
  .chip-warn{background:#fff3dc;color:#8a5500;}
  .chip-danger{background:#ffe6e6;color:#c0392b;}
  .chip-neutral{background:#f0f2f8;color:#555;}
  .chip-blue{background:var(--anton-l);color:var(--anton);}

  /* ── Sections ── */
  .section{margin:10px 12px;background:var(--card);border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .section-header{padding:11px 15px;background:var(--anton-l);font-size:11px;font-weight:800;
    color:var(--anton);letter-spacing:0.8px;text-transform:uppercase;border-bottom:1px solid var(--border);}
  .section-body{padding:14px 15px;}
  .desc-text{font-size:14px;line-height:1.65;color:var(--text);}
  .oil-box{background:#f8f9fc;border-radius:10px;padding:12px 14px;margin-top:8px;border:1px solid var(--border);}
  .oil-label{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px;}
  .oil-val{font-size:14px;font-weight:700;color:var(--text);}
  .oil-nota{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.55;}
  .warn-box{background:#fff8e6;border:1px solid #f0c040;border-radius:10px;
    padding:11px 14px;margin-top:10px;font-size:13px;font-weight:600;color:#7a4a00;display:flex;gap:8px;align-items:flex-start;}

  /* ── PT Table ── */
  .pt-table{width:100%;border-collapse:collapse;font-size:13px;}
  .pt-table th{background:var(--anton);color:#fff;padding:9px 12px;text-align:center;font-weight:700;font-size:12px;}
  .pt-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border);}
  .pt-table tr:last-child td{border-bottom:none;}
  .pt-table tr:nth-child(even) td{background:#f8f9fc;}
  .pt-table tr:hover td{background:var(--anton-l);}
  .chart-area{padding:12px 8px 6px;}
  .chart-svg{width:100%;display:block;}

  /* ── Comparison ── */
  .cmp-table{width:100%;border-collapse:collapse;font-size:12px;}
  .cmp-table th{background:var(--anton-l);padding:9px 6px;text-align:center;font-weight:700;font-size:11px;color:var(--anton);border-bottom:1px solid var(--border);}
  .cmp-table td{padding:7px 6px;border-bottom:1px solid var(--border);}
  .row-label{text-align:left;font-size:11px;color:var(--sub);font-weight:600;padding-left:12px;}
  .cmp-table tr:last-child td{border-bottom:none;}

  /* ── Simulator cards ── */
  .sim-card{background:var(--card);margin:10px 12px;border-radius:var(--radius);
    padding:15px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .sim-label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .sim-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;
    font-size:15px;outline:none;color:var(--text);background:#fafbfd;transition:border .2s;}
  .sim-input:focus{border-color:var(--anton);}
  .sim-result{background:linear-gradient(135deg,#163d6d,#1B4F8A);color:#fff;
    border-radius:var(--radius);padding:16px;text-align:center;margin:10px 12px;box-shadow:var(--shadow);}
  .sim-result-label{font-size:12px;opacity:0.75;margin-bottom:3px;}
  .sim-result-val{font-size:30px;font-weight:900;line-height:1;}
  .sim-result-unit{font-size:13px;opacity:0.75;margin-top:2px;}

  /* ── SH/SC ── */
  .diagnosis-box{border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13px;font-weight:600;line-height:1.55;}
  .diag-ok{background:#e0f5e9;color:#1a7a3a;}
  .diag-warn{background:#fff3dc;color:#8a5500;}
  .diag-danger{background:#ffe6e6;color:#c0392b;}

  /* ── Carnot ── */
  .carnot-panel{background:var(--card);margin:10px 12px;border-radius:var(--radius);
    border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);}
  .carnot-panel-header{background:var(--anton-l);padding:11px 15px;font-size:11px;
    font-weight:800;color:var(--anton);text-transform:uppercase;letter-spacing:0.7px;border-bottom:1px solid var(--border);}
  .cop-row{display:flex;gap:8px;padding:12px 14px;}
  .cop-cell{flex:1;text-align:center;background:#f8f9fc;border-radius:10px;padding:12px 6px;border:1px solid var(--border);}
  .cop-lbl{font-size:10px;color:var(--sub);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px;}
  .cop-val{font-size:22px;font-weight:900;color:var(--anton);}
  .cop-sub{font-size:10px;color:var(--sub);margin-top:2px;}
  .carnot-temp-row{display:flex;gap:8px;padding:12px 14px;}
  .carnot-temp-box{flex:1;background:linear-gradient(135deg,#163d6d,#1B4F8A);color:#fff;border-radius:12px;padding:12px;text-align:center;}
  .carnot-temp-val{font-size:22px;font-weight:900;}
  .carnot-temp-lbl{font-size:10px;opacity:0.7;margin-top:2px;}
  .carnot-arrow{align-self:center;font-size:22px;opacity:0.5;}
  .carnot-pressure-row{display:flex;gap:8px;padding:10px 14px;background:#f8f9fc;border-top:1px solid var(--border);}
  .carnot-pres-item{flex:1;text-align:center;}
  .carnot-pres-val{font-size:16px;font-weight:800;color:var(--anton);}
  .carnot-pres-label{font-size:10px;color:var(--sub);}
  .cop-bar-wrap{padding:10px 15px 14px;}
  .cop-bar-label{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px;}
  .cop-bar-track{background:var(--anton-l);border-radius:6px;height:10px;overflow:hidden;}
  .cop-bar-fill{height:100%;border-radius:6px;background:var(--anton);}
  .cop-bar-fill.real{background:#0a7e4f;}

  /* ── Ciclo ── */
  .num-input-wrap{display:flex;align-items:center;gap:0;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
  .num-btn{background:#f4f6fa;border:none;color:var(--anton);font-size:20px;font-weight:700;
    width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .num-btn:active{background:var(--anton-l);}
  .num-field{border:none;outline:none;text-align:center;font-size:16px;font-weight:700;color:var(--text);
    flex:1;height:40px;background:transparent;min-width:0;}

  /* ── Teoria ── */
  .teoria-card{background:var(--card);margin:8px 12px;border-radius:var(--radius);
    border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);}
  .teoria-header{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:10px;}
  .teoria-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;flex:1;}
  .teoria-badge{font-size:10px;padding:3px 9px;border-radius:8px;font-weight:700;white-space:nowrap;flex-shrink:0;}
  .teoria-body{padding:0 15px 15px;}
  .teoria-quick{background:var(--anton-l);border-radius:10px;padding:11px 13px;margin-bottom:10px;border:1px solid var(--border);}
  .teoria-quick-label{font-size:10px;font-weight:800;color:var(--anton);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
  .teoria-quick-text{font-size:13px;color:var(--text);line-height:1.6;}
  .teoria-deep{font-size:13px;color:var(--sub);line-height:1.7;}
  .teoria-formula{background:#1a2133;color:#e0eaff;border-radius:10px;padding:11px 14px;
    font-family:'SF Mono',Menlo,monospace;font-size:12px;margin:8px 0;line-height:1.6;}
  .teoria-ref-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .teoria-ref{font-size:11px;padding:3px 10px;border-radius:8px;background:var(--anton-l);color:var(--anton);font-weight:600;}

  /* ── Aplicación screen ── */
  .app-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px;}
  .app-cat-card{background:var(--card);border-radius:var(--radius);padding:18px 14px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    border:1.5px solid var(--border);box-shadow:var(--shadow-sm);transition:all .18s;}
  .app-cat-card:active,.app-cat-card:hover{border-color:var(--anton);transform:translateY(-1px);box-shadow:var(--shadow);}
  .app-cat-icon{font-size:32px;line-height:1;}
  .app-cat-name{font-size:13px;font-weight:700;color:var(--text);}
  .app-cat-count{font-size:11px;color:var(--sub);}

  /* ── Misc ── */
  .empty{text-align:center;padding:52px 24px;color:var(--sub);}
  .empty-icon{font-size:44px;margin-bottom:12px;}
  .empty-text{font-size:14px;line-height:1.6;}

  /* ── Biblioteca ── */
  .bib-header{padding:16px 16px 0;}
  .bib-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .bib-sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
  .bib-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin:0 12px 10px;padding:14px 14px 12px;box-shadow:var(--shadow-sm);}
  .bib-gas-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bib-gas-name{font-size:14px;font-weight:700;color:var(--text);flex:1;}
  .bib-gas-sub{font-size:11px;color:var(--sub);}
  .bib-docs{display:flex;gap:8px;flex-wrap:wrap;}
  .bib-doc-btn{
    display:flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:8px;border:none;cursor:pointer;
    font-size:12px;font-weight:600;text-decoration:none;
    transition:opacity .15s,transform .1s;
  }
  .bib-doc-btn:active{opacity:.8;transform:scale(.97);}
  .bib-doc-sds{background:#e8f0fb;color:#1B4F8A;}
  .bib-doc-traslado{background:#e8f5ed;color:#1a7a3a;}
  .bib-doc-catalogo{background:#f3eafb;color:#6b21a8;}
  .bib-doc-na{background:#f0f0f2;color:#aaa;cursor:default;}
  .bib-pill{font-size:9px;background:rgba(255,255,255,0.7);
    border-radius:4px;padding:1px 5px;color:inherit;font-weight:700;letter-spacing:.3px;}

  /* ── Auth Screens ── */
  .auth-screen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(160deg,#1B4F8A 0%,#0f3060 55%,#091d3e 100%);
    padding:24px;z-index:9999;
  }
  .splash-logo{width:180px;height:auto;filter:brightness(0) invert(1);margin-bottom:16px;animation:fadeUp .8s ease both;}
  .splash-tagline{color:rgba(255,255,255,0.7);font-size:13px;letter-spacing:2px;text-transform:uppercase;
    margin-bottom:48px;animation:fadeUp .8s .2s ease both;}
  .splash-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.4);
    animation:pulse 1.4s ease-in-out infinite;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.85);}50%{opacity:1;transform:scale(1);}}

  .auth-card{
    width:100%;max-width:400px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.13);
    border-radius:20px;padding:32px 28px;
    backdrop-filter:blur(16px);
  }
  .auth-logo{width:130px;height:auto;filter:brightness(0) invert(1);margin:0 auto 24px;display:block;}
  .auth-title{color:#fff;font-size:20px;font-weight:700;text-align:center;margin-bottom:4px;}
  .auth-sub{color:rgba(255,255,255,0.55);font-size:13px;text-align:center;margin-bottom:28px;}
  .auth-field{margin-bottom:16px;}
  .auth-label{display:block;color:rgba(255,255,255,0.7);font-size:12px;font-weight:600;
    letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
  .auth-input{
    width:100%;box-sizing:border-box;
    background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);
    border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none;
    transition:border-color .2s;
  }
  .auth-input::placeholder{color:rgba(255,255,255,0.3);}
  .auth-input:focus{border-color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.12);}
  .auth-select{
    width:100%;box-sizing:border-box;
    background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);
    border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none;
    appearance:none;-webkit-appearance:none;
  }
  .auth-select option{background:#1B4F8A;color:#fff;}
  .auth-btn{
    width:100%;padding:13px;border:none;border-radius:10px;
    background:linear-gradient(135deg,#2b76d4,#1B4F8A);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    margin-top:8px;letter-spacing:.3px;
    transition:opacity .2s,transform .1s;
  }
  .auth-btn:active{opacity:.85;transform:scale(.98);}
  .auth-link{color:rgba(255,255,255,0.55);font-size:13px;text-align:center;
    margin-top:20px;cursor:pointer;}
  .auth-link span{color:#7ab4f5;font-weight:600;text-decoration:underline;}
  .auth-error{
    background:rgba(220,50,50,0.18);border:1px solid rgba(220,80,80,0.35);
    border-radius:8px;padding:10px 14px;color:#ffaaaa;font-size:13px;margin-bottom:14px;
  }
  .auth-divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0;}

  /* ── Dark Mode ── */
  html[data-theme='dark']{
    --bg:#0f1117; --card:#181c28; --text:#e2e8f5; --sub:#7b90bb;
    --border:#252a3d; --radius:14px; --shadow:0 2px 12px rgba(0,0,0,0.35);
    --shadow-sm:0 1px 4px rgba(0,0,0,0.25);
    --anton:#4d8dd4; --anton-d:#3a72bb; --anton-l:#1a2844;
  }
  html[data-theme='dark'] .header{background:linear-gradient(135deg,#0e2444 0%,#1a3a6a 100%);}
  html[data-theme='dark'] .gas-card{background:var(--card);}
  html[data-theme='dark'] .search-input{background:#1e2436;color:var(--text);border-color:var(--border);}
  html[data-theme='dark'] .search-input::placeholder{color:var(--sub);}
  html[data-theme='dark'] .nav{background:#181c28;border-top-color:var(--border);}
  html[data-theme='dark'] .sim-card,.dark-card{background:var(--card);border-color:var(--border);}
  html[data-theme='dark'] .auth-screen{background:linear-gradient(160deg,#0e2444 0%,#091629 100%);}
  html[data-theme='dark'] input,html[data-theme='dark'] select{
    background:#1e2436;color:var(--text);border-color:var(--border);}
  html[data-theme='dark'] .search-wrap{background:#1e2436;border-color:var(--border);}
  html[data-theme='dark'] body{background:var(--bg);color:var(--text);}
  html[data-theme='dark'] .prod-img-bg{background:#1a1f2e !important;}

  /* ── Dark mode toggle btn ── */
  .theme-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.75);
    font-size:18px;padding:4px;line-height:1;flex-shrink:0;}
  .theme-btn:hover{color:#fff;}

  /* ── User avatar / profile ── */
  .user-avatar{
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.2);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;
    border:1.5px solid rgba(255,255,255,0.3);position:relative;
  }
  .user-menu{
    position:absolute;top:calc(100% + 8px);right:0;
    background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.18);
    border:1px solid #e4e8f2;min-width:200px;overflow:hidden;z-index:999;
  }
  html[data-theme='dark'] .user-menu{background:#1e2436;border-color:#2a3050;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
  .user-menu-header{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--anton-l);}
  html[data-theme='dark'] .user-menu-header{background:#1a2844;}
  .user-menu-name{font-size:13px;font-weight:700;color:var(--text);}
  .user-menu-role{font-size:11px;color:var(--sub);margin-top:2px;}
  .user-menu-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 16px;font-size:13px;color:var(--text);
    cursor:pointer;border:none;background:none;width:100%;text-align:left;
    transition:background .15s;
  }
  .user-menu-item:hover{background:var(--bg);}
  .user-menu-item.danger{color:#c0392b;}
  html[data-theme='dark'] .user-menu-item.danger{color:#ff6b6b;}

  /* ── Carga / Charge Calculator ── */
  .carga-section{padding:0 14px 12px;}
  .carga-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .carga-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;}
  .carga-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .carga-label{font-size:12px;color:var(--sub);font-weight:600;min-width:130px;}
  .carga-input{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
    padding:8px 12px;font-size:14px;color:var(--text);outline:none;}
  .carga-input:focus{border-color:var(--anton);}
  .carga-select{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
    padding:8px 12px;font-size:14px;color:var(--text);outline:none;appearance:none;}
  .carga-result{background:var(--anton);border-radius:var(--radius);padding:16px;color:#fff;text-align:center;}
  .carga-result-val{font-size:36px;font-weight:800;line-height:1;}
  .carga-result-unit{font-size:13px;opacity:.8;margin-top:4px;}
  .carga-result-sub{font-size:12px;opacity:.65;margin-top:8px;}
  .carga-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .carga-mini{background:var(--anton-l);border-radius:10px;padding:12px;text-align:center;}
  html[data-theme='dark'] .carga-mini{background:#1a2844;}
  .carga-mini-val{font-size:18px;font-weight:700;color:var(--anton);}
  .carga-mini-lbl{font-size:11px;color:var(--sub);margin-top:2px;}

  /* ── Unit Toggle ── */
  .unit-toggle{display:flex;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;margin-left:auto;}
  .unit-btn{padding:5px 12px;font-size:12px;font-weight:600;border:none;cursor:pointer;
    background:none;color:var(--sub);transition:all .15s;}
  .unit-btn.active{background:var(--anton);color:#fff;}
</style>

async function hashPass(password){
  try{
    const enc=new TextEncoder();
    const buf=await crypto.subtle.digest('SHA-256',enc.encode('anton_salt_2025_'+password));

const GAS_LIST = Object.values(GASES);
function barToPsig(bar){ return (bar*14.5038-14.696); }
function barToPsi(bar){ return bar*14.5038; }
function gwpColor(gwp){ return gwp<=750?'gwp-low':gwp<=2000?'gwp-mid':'gwp-high'; }
function interpBar(gas,t){
  const data=gas.ptData; const tv=parseFloat(t);
  if(isNaN(tv)) return null;
  if(tv<=data[0][0]) return data[0][1];
  if(tv>=data[data.length-1][0]) return data[data.length-1][1];
  for(let i=0;i<data.length-1;i++){
    if(tv>=data[i][0]&&tv<=data[i+1][0]){
      const f=(tv-data[i][0])/(data[i+1][0]-data[i][0]);
      return data[i][1]+f*(data[i+1][1]-data[i][1]);
    }
  }
  return null;
}
function barToTemp(gas,bar){
  const data=gas.ptData;
  if(bar<=data[0][1]) return data[0][0];
  if(bar>=data[data.length-1][1]) return data[data.length-1][0];
  for(let i=0;i<data.length-1;i++){
    if(bar>=data[i][1]&&bar<=data[i+1][1]){
      const f=(bar-data[i][1])/(data[i+1][1]-data[i][1]);
      return data[i][0]+f*(data[i+1][0]-data[i][0]);
    }
  }
  return null;
}

// ── PT Chart ──────────────────────────────────────────────────────────────────
function PTChart({gas}){
  const W=320,H=180,PAD={top:12,right:14,bottom:36,left:50};
  const data=gas.ptData.map(([t,bar])=>({t,p:barToPsig(bar)}));
  const minT=data[0].t,maxT=data[data.length-1].t;
  const maxP=Math.max(...data.map(d=>d.p));
  const niceMax=Math.ceil(maxP/50)*50;
  const x=t=>PAD.left+(t-minT)/(maxT-minT)*(W-PAD.left-PAD.right);
  const y=p=>PAD.top+(1-p/niceMax)*(H-PAD.top-PAD.bottom);
  const pts=data.map(d=>`${x(d.t).toFixed(1)},${y(d.p).toFixed(1)}`).join(' ');
  const ticks=data.filter((_,i)=>i%2===0);
  const yTicks=[0,niceMax*0.25,niceMax*0.5,niceMax*0.75,niceMax].map(v=>Math.round(v));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg">
      {yTicks.map(v=><line key={v} x1={PAD.left} x2={W-PAD.right} y1={y(v)} y2={y(v)} stroke="#e8eef7" strokeWidth="1"/>)}
      <line x1={PAD.left} x2={PAD.left} y1={PAD.top} y2={H-PAD.bottom} stroke="#ccc" strokeWidth="1"/>
      <line x1={PAD.left} x2={W-PAD.right} y1={H-PAD.bottom} y2={H-PAD.bottom} stroke="#ccc" strokeWidth="1"/>
      <polyline points={pts} fill="none" stroke={ANTON} strokeWidth="2.5" strokeLinejoin="round"/>
      {data.map((d,i)=><circle key={i} cx={x(d.t)} cy={y(d.p)} r="3" fill={ANTON} opacity="0.7"/>)}
      {ticks.map(d=><text key={d.t} x={x(d.t)} y={H-PAD.bottom+14} textAnchor="middle" fontSize="9" fill="#888">{d.t}°</text>)}
      {yTicks.map(v=><text key={v} x={PAD.left-6} y={y(v)+3.5} textAnchor="end" fontSize="9" fill="#888">{v}</text>)}
      <text x={W/2} y={H-2} textAnchor="middle" fontSize="10" fill="#666">Temperatura (°C)</text>
      <text transform={`rotate(-90) translate(-${H/2},10)`} textAnchor="middle" fontSize="10" fill="#666">P sat (psig)</text>
    </svg>
  );
}

                let best=null;
                if(p.better==='lower'){const nums=vals.filter(v=>typeof v==='number');if(nums.length)best=Math.min(...nums);}
                return(<tr key={p.label}><td className="row-label">{p.label}</td>{vals.map((v,i)=>(<td key={i} style={{textAlign:'center',color:COLORS[i],fontWeight:600,fontSize:12}}>{v}{p.better==='lower'&&v===best&&<span style={{color:'#0a7e4f',fontSize:10}}> ✓</span>}</td>))}</tr>);
              })}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

function SuperheatScreen(){
  const [gasId,setGasId]=React.useState('R410A');

  const [pDischarge,setPDischarge]=React.useState('');
  const [tLiquid,setTLiquid]=React.useState('');
  const gas=GASES[gasId];
  function psigToBar(psig){return(parseFloat(psig)+14.696)/14.5038;}
  const hasSH=pSuction!==''&&tSuction!=='';
  const hasSC=pDischarge!==''&&tLiquid!=='';
  let tSatSuction=null,sh=null,tSatDischarge=null,sc=null;
  if(hasSH){tSatSuction=barToTemp(gas,psigToBar(pSuction));if(tSatSuction!=null)sh=parseFloat(tSuction)-tSatSuction;}
  if(hasSC){tSatDischarge=barToTemp(gas,psigToBar(pDischarge));if(tSatDischarge!=null)sc=tSatDischarge-parseFloat(tLiquid);}
  function shDiag(v){
    if(v<2) return {cls:'diag-danger',msg:'⚠️ MUY BAJO — Riesgo de líquido en compresor.'};
    if(v<5) return {cls:'diag-warn',msg:'⚡ BAJO — Aceptable en TXV. Monitorear.'};
    if(v<=10) return {cls:'diag-ok',msg:'✅ IDEAL — Rango normal para TXV.'};
    if(v<=18) return {cls:'diag-warn',msg:'⚡ ALTO — Normal en capilar. En TXV puede indicar falta de carga.'};
    return {cls:'diag-danger',msg:'🔴 MUY ALTO — Falta de carga o restricción en el circuito.'};
  }
  function scDiag(v){
    if(v<2) return {cls:'diag-warn',msg:'⚡ BAJO — Posible flash gas en línea de líquido.'};
    if(v<=8) return {cls:'diag-ok',msg:'✅ IDEAL — Subenfriamiento normal.'};
    if(v<=15) return {cls:'diag-warn',msg:'⚡ ALGO ALTO — Verificar exceso de carga.'};
    return {cls:'diag-danger',msg:'🔴 MUY ALTO — Posible exceso de carga.'};

  return (
    <div className="content" style={{paddingTop:8}}>
      <div className="divider">Superheat y Subcooling</div>

        <div style={{padding:'10px 14px',background:'#e8eef7',fontSize:12,fontWeight:700,color:'var(--anton)',textTransform:'uppercase',letterSpacing:'0.5px'}}>🌡️ Superheat</div>
        <div style={{padding:'12px 14px'}}>
          <div style={{display:'flex',gap:8}}>
            <div style={{flex:1}}><div className="sim-label">P aspiración (psig)</div><input className="sim-input" type="number" value={pSuction} onChange={e=>setPSuction(e.target.value)} placeholder="Ej: 55"/></div>
            <div style={{flex:1}}><div className="sim-label">T línea aspiración (°C)</div><input className="sim-input" type="number" value={tSuction} onChange={e=>setTSuction(e.target.value)} placeholder="Ej: 5"/></div>
          </div>
          {sh!=null&&(
            <div style={{marginTop:10}}>
              <div style={{display:'flex',gap:8,marginBottom:8}}>
                <div style={{flex:1,background:'#f8f9fb',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:10,color:'#888',fontWeight:600}}>T° SAT. ASPIRACIÓN</div><div style={{fontSize:18,fontWeight:800,color:'var(--anton)'}}>{tSatSuction.toFixed(1)}°C</div></div>
                <div style={{flex:1,background:'var(--anton)',borderRadius:8,padding:'10px',textAlign:'center'}}><div style={{fontSize:10,color:'rgba(255,255,255,0.8)',fontWeight:600}}>SUPERHEAT</div><div style={{fontSize:22,fontWeight:800,color:'#fff'}}>{sh.toFixed(1)}°C</div></div>
              </div>
              <div className={`diagnosis-box ${shDiag(sh).cls}`}>{shDiag(sh).msg}</div>

      <div style={{margin:'8px 12px',background:'#fff',borderRadius:'var(--radius)',border:'1px solid var(--border)',overflow:'hidden'}}>
        <div style={{padding:'10px 14px',background:'#fff3dc',fontSize:12,fontWeight:700,color:'#a05a00',textTransform:'uppercase',letterSpacing:'0.5px'}}>❄️ Subcooling</div>
        <div style={{padding:'12px 14px'}}>

// ── NumInput component (used by CicloScreen) ─────────────────────────────────
function NumInput({lbl,val,onSet,min,max,step=1,col='#1B4F8A',unit='deg'}){
  const unitLabel = unit==='deg' ? '°C' : unit;
  const dec = step < 1 ? 1 : 0;
  const down = () => onSet(v => +(Math.max(min, v-step).toFixed(dec)));
  const up   = () => onSet(v => +(Math.min(max, v+step).toFixed(dec)));
  const btn = (txt,fn) => (
    <button onClick={fn} style={{width:28,height:28,borderRadius:7,border:`1.5px solid ${col}44`,
      background:'white',color:col,fontWeight:900,fontSize:17,cursor:'pointer',
      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,lineHeight:1,
      WebkitTapHighlightColor:'transparent'}}>
      {txt}
    </button>
  );
  return (
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:7}}>
      <span style={{fontSize:10.5,color:'#555',width:96,flexShrink:0,fontWeight:600}}>{lbl}</span>
      {btn('−',down)}
      <input type="number" value={val} min={min} max={max} step={step}
        onChange={e=>{const v=+e.target.value; if(!isNaN(v)&&v>=min&&v<=max) onSet(()=>v);}}
        style={{width:54,textAlign:'center',border:`1.5px solid ${col}66`,borderRadius:7,
          padding:'4px 0',fontSize:15,fontWeight:700,color:col,outline:'none',
          WebkitAppearance:'none',MozAppearance:'textfield'}}/>
      {btn('+',up)}
      <span style={{fontSize:10,color:'#888',flexShrink:0,width:22}}>{unitLabel}</span>
    </div>
  );
}

                   'R600a','R600','R290','R449A','R454B','R454C','R455A','R513A',

  const pLow=interpBar(gas,tevap);
  const pHigh=interpBar(gas,tcond);

  const T1=tevap+sh; const T3=tcond-sc; const T4=tevap;
  const rc=valid?pHigh/pLow:null;

  const TeK=tevap+273.15, TcK=tcond+273.15;
  const copCarnot=valid?TeK/(TcK-TeK):null;
  const copReal=copCarnot?+(copCarnot*0.55).toFixed(2):null;

// ── Carnot Screen ─────────────────────────────────────────────────────────────
function CarnotScreen(){
  const [tevap,setTevap]=React.useState('-10');
  const [tcond,setTcond]=React.useState('45');
  const [gasId,setGasId]=React.useState('R410A');
  const Te=parseFloat(tevap),Tc=parseFloat(tcond);
  const gas=GASES[gasId];
  const valid=!isNaN(Te)&&!isNaN(Tc)&&Tc>Te;
  const TeK=Te+273.15,TcK=Tc+273.15;
  const copCarnot=valid?TeK/(TcK-TeK):null;
  const copHP=valid?TcK/(TcK-TeK):null;
  const eta=valid?(1-TeK/TcK)*100:null;
  const copReal=valid?copCarnot*0.55:null;
  const pEvap=valid?interpBar(gas,tevap):null;
  const pCond=valid?interpBar(gas,tcond):null;
  const rc=pEvap&&pCond?pCond/pEvap:null;
  function interpBar2(gas,t){return interpBar(gas,t);}
  return (
    <div className="content" style={{paddingTop:8}}>
      <div className="divider">Eficiencia de Carnot</div>
      <div className="sim-card">
        <div className="sim-label">Gas Refrigerante</div>
        <select className="sim-input" value={gasId} onChange={e=>setGasId(e.target.value)}>
          {GAS_LIST.map(g=><option key={g.id} value={g.id}>{g.antonName||g.name}</option>)}
        </select>
      </div>
      <div className="carnot-panel">
        <div className="carnot-panel-header">Temperaturas del Ciclo</div>
        <div className="carnot-temp-row">
          <div className="carnot-temp-box" style={{background:'#2980b9'}}>
            <div className="carnot-temp-val">{tevap}°C</div>
            <div className="carnot-temp-lbl">T° Evaporación</div>
            <input type="range" min="-50" max="20" value={tevap} onChange={e=>setTevap(e.target.value)} style={{width:'100%',marginTop:6,accentColor:'#fff'}}/>
          </div>
          <div className="carnot-arrow">→</div>
          <div className="carnot-temp-box" style={{background:'#e74c3c'}}>
            <div className="carnot-temp-val">{tcond}°C</div>
            <div className="carnot-temp-lbl">T° Condensación</div>
            <input type="range" min="25" max="70" value={tcond} onChange={e=>setTcond(e.target.value)} style={{width:'100%',marginTop:6,accentColor:'#fff'}}/>
          </div>
        </div>
        {valid&&pEvap&&pCond&&(
          <div className="carnot-pressure-row">
            <div className="carnot-pres-item"><div className="carnot-pres-val" style={{color:'#2980b9'}}>{barToPsig(pEvap).toFixed(0)} psig</div><div className="carnot-pres-label">P Baja · {pEvap.toFixed(2)} bar</div></div>
            <div className="carnot-pres-item"><div className="carnot-pres-val" style={{color:'#e74c3c'}}>{barToPsig(pCond).toFixed(0)} psig</div><div className="carnot-pres-label">P Alta · {pCond.toFixed(2)} bar</div></div>
            {rc&&<div className="carnot-pres-item"><div className="carnot-pres-val">{rc.toFixed(2)}</div><div className="carnot-pres-label">Relación Compresión</div></div>}
          </div>
        )}
      </div>
      {valid&&(<>
        <div className="carnot-panel">
          <div className="carnot-panel-header">COP — Coeficiente de Rendimiento</div>
          <div className="cop-row">
            <div className="cop-cell"><div className="cop-lbl">COP Carnot (Refrig.)</div><div className="cop-val">{copCarnot.toFixed(2)}</div><div className="cop-sub">Límite teórico</div></div>
            <div className="cop-cell"><div className="cop-lbl">COP Real (~55%)</div><div className="cop-val" style={{color:'#0a7e4f'}}>{copReal.toFixed(2)}</div><div className="cop-sub">Sistema real est.</div></div>
            <div className="cop-cell"><div className="cop-lbl">COP Bomba Calor</div><div className="cop-val">{copHP.toFixed(2)}</div><div className="cop-sub">Carnot HP</div></div>
          </div>
          <div className="cop-bar-wrap">
            <div className="cop-bar-label">COP Carnot</div>
            <div className="cop-bar-track"><div className="cop-bar-fill" style={{width:`${Math.min(copCarnot/10*100,100)}%`}}/></div>
          </div>
          <div className="cop-bar-wrap">
            <div className="cop-bar-label">COP Real estimado</div>
            <div className="cop-bar-track"><div className="cop-bar-fill real" style={{width:`${Math.min(copReal/10*100,100)}%`}}/></div>
          </div>
        </div>
        <div className="carnot-panel">
          <div className="carnot-panel-header">Eficiencia Termodinámica</div>
          <div className="cop-row">
            <div className="cop-cell"><div className="cop-lbl">η Carnot</div><div className="cop-val">{eta.toFixed(1)}%</div><div className="cop-sub">Eficiencia ciclo</div></div>
            <div className="cop-cell"><div className="cop-lbl">ΔT Ciclo</div><div className="cop-val">{(Tc-Te).toFixed(0)}°C</div><div className="cop-sub">Diferencial</div></div>
            <div className="cop-cell"><div className="cop-lbl">EER equiv.</div><div className="cop-val">{(copReal*3.412).toFixed(1)}</div><div className="cop-sub">BTU/h·W</div></div>
          </div>
        </div>
      </>)}
      {!valid&&<div style={{padding:20,textAlign:'center',color:'#888',fontSize:13}}>T° condensación debe ser mayor a T° evaporación.</div>}
      <div style={{height:16}}/>
    </div>
  );
}

      <div className="divider">Elegí por Aplicación</div>

      {!selApp ? (
        <div style={{padding:'0 12px'}}>
          <div style={{fontSize:12,color:'#888',marginBottom:12}}>Seleccioná el tipo de sistema para ver los gases recomendados.</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {APPS.map(a=>(
              <button key={a.id} onClick={()=>{setSelApp(a.id);setSelCat('Todos');setSelGas(null);}}
                style={{background:'white',border:'1.5px solid #1B4F8A22',borderRadius:12,padding:'14px 8px',
                  cursor:'pointer',textAlign:'center',boxShadow:'0 1px 4px rgba(0,0,0,0.07)',
                  WebkitTapHighlightColor:'transparent'}}>
                <div style={{fontSize:24,marginBottom:6}}>{a.icon}</div>
                <div style={{fontSize:11,fontWeight:700,color:'#1B4F8A',lineHeight:1.3}}>{a.lbl}</div>
              </button>
            ))}
          </div>
          <div style={{height:20}}/>
        </div>
      ) : (
        <div>
          {/* Back + app header */}
          <div style={{padding:'0 12px 8px',display:'flex',alignItems:'center',gap:10}}>
            <button onClick={()=>{setSelApp(null);setSelCat('Todos');}}
              style={{background:'none',border:'none',color:'#1B4F8A',fontSize:13,fontWeight:700,cursor:'pointer',padding:0,flexShrink:0}}>
              ← Volver
            </button>
            <div style={{fontSize:13,fontWeight:800,color:'#1B4F8A'}}>
              {APPS.find(a=>a.id===selApp)?.icon} {APPS.find(a=>a.id===selApp)?.lbl}
            </div>
          </div>

          {/* Category filter pills */}
          {cats.length>2&&(
            <div style={{display:'flex',gap:6,padding:'0 12px 10px',overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
              {cats.map(c=>(
                <button key={c} onClick={()=>setSelCat(c)}
                  style={{flexShrink:0,padding:'5px 12px',borderRadius:20,border:`1.5px solid ${c==='Todos'?'#1B4F8A':CAT_COL[c]||'#888'}55`,
                    background:selCat===c?(c==='Todos'?'#1B4F8A':CAT_COL[c]||'#555'):'white',
                    color:selCat===c?'white':(c==='Todos'?'#1B4F8A':CAT_COL[c]||'#555'),
                    fontSize:11,fontWeight:700,cursor:'pointer',WebkitTapHighlightColor:'transparent'}}>
                  {c}
                </button>
              ))}
            </div>
          )}

          {/* Gas cards */}
          <div style={{padding:'0 12px'}}>
            {matched.length===0&&<div style={{textAlign:'center',color:'#aaa',padding:24,fontSize:13}}>Sin resultados para este filtro.</div>}
            {matched.map(g=>{
              const col=CAT_COL[g.category]||'#555';
              const gwpLbl=g.gwp<=10?'Ultra bajo':g.gwp<=750?'Bajo':g.gwp<=2000?'Medio':'Alto';
              const gwpC=g.gwp<=10?'#27ae60':g.gwp<=750?'#2980b9':g.gwp<=2000?'#e67e22':'#e74c3c';
              return(
                <div key={g.id} onClick={()=>setSelGas(g)}
                  style={{background:'white',borderRadius:12,border:`1.5px solid ${col}22`,
                    padding:'12px 14px',marginBottom:9,boxShadow:'0 1px 4px rgba(0,0,0,0.07)',cursor:'pointer'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                    <div>
                      <span style={{display:'inline-block',background:col,color:'white',borderRadius:6,
                        padding:'2px 8px',fontSize:11,fontWeight:800,marginRight:6}}>{g.category}</span>
                      <span style={{fontSize:15,fontWeight:900,color:'#1B4F8A'}}>{g.antonName||g.name}</span>
                    </div>
                    <span style={{fontSize:10,color:gwpC,fontWeight:700,background:`${gwpC}18`,
                      borderRadius:5,padding:'2px 6px',flexShrink:0}}>GWP {gwpLbl}</span>
                  </div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:6}}>
                    {[
                      [`GWP: ${g.gwp}`,'#555'],
                      [g.ashraeSafety, g.ashraeSafety==='A3'?'#e74c3c':g.ashraeSafety==='A2L'?'#e67e22':'#27ae60'],
                      [`PE: ${g.normalBoilingPoint}°C`,'#555'],
                      [g.aceite,'#888'],
                    ].map(([t,c])=>(
                      <span key={t} style={{fontSize:10,color:c,background:'#f5f5f5',borderRadius:5,padding:'2px 7px',fontWeight:600}}>{t}</span>
                    ))}
                  </div>
                  <div style={{fontSize:11,color:'#666',lineHeight:1.4}}>
                    {g.description.length>90?g.description.slice(0,90)+'…':g.description}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{height:20}}/>
        </div>
      )}
    </div>
  );
}

// ── Teoria Screen ─────────────────────────────────────────────────────────────
function TeoriaScreen(){
  const [open,setOpen]=React.useState({});
  const toggle=k=>setOpen(p=>({...p,[k]:!p[k]}));
  const conceptos=[
    {id:'ciclo',icon:'🔄',title:'Ciclo de Refrigeración por Compresión',badge:'Fundamental',bc:'#1B4F8A',
     quick:'Un sistema de refrigeración mueve calor desde un espacio frío hacia uno caliente usando un gas que circula en 4 etapas: evaporación → compresión → condensación → expansión.',
     deep:`4 procesos termodinámicos:

1. EVAPORACIÓN (baja P): El refrigerante líquido absorbe calor y se evapora. Ocurre entre -30°C y +10°C.
2. COMPRESIÓN: El compresor eleva la presión y temperatura del gas. Único proceso que consume energía eléctrica.
3. CONDENSACIÓN (alta P): El gas caliente cede calor al ambiente y se condensa en líquido. Ocurre entre 30°C y 60°C.
4. EXPANSIÓN: La válvula (capilar o TXV) reduce la presión bruscamente, bajando la temperatura.`,
     refs:['Evaporación','Compresión','Condensación','Expansión','P-H Diagrama']},
    {id:'pt',icon:'📈',title:'Presión de Saturación — Curva P-T',badge:'Esencial',bc:'#0a7e4f',
     quick:'A cada temperatura le corresponde una única presión de saturación. Si sabés la presión en el evaporador, sabés la temperatura de evaporación. Base del diagnóstico de campo.',
     deep:`Con un manómetro en aspiración:
• Presión baja → T° evap. baja → posible falta de carga o restricción
• Presión alta → T° evap. alta → posible exceso de carga o válvula trabada

En mezclas zeotrópmicas hay diferencia entre punto de burbuja (inicio ebullición) y punto de rocío (fin evaporación). Esa diferencia es el GLIDE.`,
     refs:['Glide','Punto de burbuja','Punto de rocío','Manómetro']},
    {id:'sh',icon:'🌡️',title:'Superheat — Recalentamiento',badge:'Campo',bc:'#7b3fa0',
     quick:'Superheat = T° línea aspiración − T° saturación a esa presión. Valor ideal en TXV: 4–8°C. Indica cuánto calor extra absorbió el gas por encima de su punto de ebullición.',
     deep:`• Superheat muy bajo (<3°C): riesgo de líquido en compresor → daño mecánico
• Superheat muy alto (>20°C en TXV): falta de carga, TXV mal calibrada o restricción
• Rango ideal TXV: 4–8°C | Capilar: 8–15°C`,
     formula:'SH = T_línea_aspiración − T_saturación(P_aspiración)',
     refs:['TXV','Capilar','Carga de refrigerante']},
    {id:'sc',icon:'❄️',title:'Subcooling — Subenfriamiento',badge:'Campo',bc:'#7b3fa0',
     quick:'Subcooling = T° saturación en alta presión − T° línea de líquido. Previene flash gas. Ideal: 4–8°C.',
     deep:`• SC < 2°C: posible flash gas, poca carga o condensador sobredimensionado
• SC 4–8°C: rango ideal
• SC > 10°C: posible exceso de carga

El flash gas deteriora el funcionamiento de la TXV y reduce la capacidad frigorífica.`,
     formula:'SC = T_saturación(P_descarga) − T_línea_líquido',
     refs:['Flash gas','Condensador','Línea de líquido']},
    {id:'glide',icon:'↕️',title:'Deslizamiento de Temperatura — Glide',badge:'Mezclas',bc:'#b85c00',
     quick:'En mezclas zeotrópmicas la temperatura de ebullición varía durante el cambio de fase. El glide es la diferencia entre punto de rocío y punto de burbuja.',
     deep:`PUNTO DE BURBUJA: temperatura a la que comienza la ebullición. Es la que lee el manómetro.
PUNTO DE ROCÍO: temperatura a la que termina la evaporación.

Ejemplos:
• R407C: glide ~7.2°C
• AN22 (R417B): glide ~1.5°C — casi como gas puro
• R407F: glide ~5.5°C

El manómetro lee la presión del punto de burbuja. La T° real del vapor es el punto de rocío.`,
     refs:['Punto de burbuja','Punto de rocío','AN22','R407C']},
    {id:'gwp',icon:'🌍',title:'GWP — Potencial de Calentamiento Global',badge:'Ambiental',bc:'#0a7e4f',
     quick:'GWP mide cuánto calienta el planeta 1 kg de gas vs 1 kg de CO₂ en 100 años. CO₂=1 por definición. R410A=2088: calienta 2088 veces más.',
     deep:`Escala GWP:
• GWP < 10: HFOs (R1234yf=4, R1234ze=7)
• GWP 100-700: bajo GWP (R513A=631, R454B=466)
• GWP 700-2000: medio (R32=675, R407C=1774)
• GWP > 2000: alto (R410A=2088, R404A=3922)

La Enmienda de Kigali exige reducir HFCs en 85% para 2047. Los gases Solstice® de Honeywell (distribuidos por Anton) cumplen las regulaciones actuales y futuras.`,
     refs:['HFC','HFO','Enmienda Kigali','Phase-down','Solstice®']},
    {id:'cop',icon:'⚡',title:'COP y EER — Eficiencia del Sistema',badge:'Eficiencia',bc:'#1B4F8A',
     quick:'COP = calor transferido / trabajo eléctrico consumido. COP=3 significa que por cada 1 kW eléctrico se mueven 3 kW de calor. Más alto es mejor.',
     deep:`COP Refrigeración: Q_evap / W_compresor. Valores típicos: 2.5–4.5 (AC), 1.5–3.5 (refrigeración comercial).
COP Bomba de Calor: Q_cond / W_comp = COP_R + 1. Siempre mayor.
EER = COP × 3.412 (BTU/h por watt).
COP de Carnot (límite teórico): T_evap(K) / (T_cond - T_evap) [en Kelvin]
Los sistemas reales operan al 40–60% del COP de Carnot.`,
     formula:'COP_R = T_evap(K) / (T_cond − T_evap) [Kelvin]',
     refs:['Carnot','EER','SEER','Eficiencia']},
    {id:'ashrae',icon:'🛡️',title:'Clases de Seguridad ASHRAE',badge:'Seguridad',bc:'#c0392b',
     quick:'ASHRAE clasifica gases en A (baja toxicidad) o B (alta) y en 1 (no inflamable), 2L (levemente inflamable), 2 (inflamable) o 3 (altamente inflamable). A1 es el más seguro.',
     deep:`Toxicidad: A = sin toxicidad identificada | B = evidencia de toxicidad
Inflamabilidad: 1 = no inflamable | 2L = levemente inflamable (llama ≤10 cm/s) | 2 = inflamable | 3 = altamente inflamable

Clases comunes:
• A1: R22, R410A, R134a, R404A, R407C/F, AN22, YH12, R448A, R449A, R513A
• A2L: R32, R454B, R454C, R455A, R1234yf — requieren precauciones
• A3: R290 (propano), R600a (isobutano) — cargas <150g`,
     refs:['A1','A2L','A3','R32','R290']},
    {id:'rc',icon:'🔧',title:'Relación de Compresión',badge:'Compresor',bc:'#5a6275',
     quick:'RC = P_descarga / P_aspiración (presión absoluta). Indica el esfuerzo del compresor. Rango ideal: 3–6. Por encima de 8 hay riesgo de sobrecalentamiento y falla.',
     deep:`RC = P_cond_abs / P_evap_abs

Interpretación:
• RC < 3: compresor trabajando poco, posible problema
• RC 3–6: rango normal y eficiente
• RC 6–8: trabajo intenso, posibles altas T° de descarga
• RC > 8: riesgo de falla, degradación del aceite, daño al compresor

Para baja temperatura (congelados, -30°C) la RC es mayor que para AC. Con RC alto se usan 2 etapas de compresión o economizadores.`,
     formula:'RC = P_cond_abs / P_evap_abs     [presiones en bar abs o psia]',
     refs:['Compresor','T° de descarga','Dos etapas']},
    {id:'aceites',icon:'🛢️',title:'Aceites Lubricantes',badge:'Lubricación',bc:'#b85c00',
     quick:'El aceite lubrica el compresor y circula por el sistema. Debe ser miscible con el gas para retornar al compresor. Usar aceite incorrecto puede destruir el compresor.',
     deep:`MINERAL: Compatible con HC y con AN22/YH12. Bajo costo. No compatible con HFCs ni HFOs puros.
ALQUILBENCENO (AB): Compatible con R22, AN22 y YH12. Ventaja clave: AN22 y YH12 NO requieren cambio de aceite en sistemas R22.
POE (Polioléster): Obligatorio con HFCs (R410A, R32, R407C/F, R404A, R448A, R449A). Absorbe humedad — no dejar expuesto al aire.
PAG: Usado en automotriz con R134a y R1234yf.

REGLA: Nunca mezclar tipos de aceite. En conversión R22→R407F, hacer flush antes de cargar POE.
EXCEPCIÓN AN22/YH12: compatibles con aceite mineral existente. No requieren flush en la mayoría de los casos.`,
     refs:['POE','PAG','Mineral','AB','AN22','YH12','Flush']},
  ];
  return (
    <div className="content" style={{paddingTop:8}}>
      <div className="divider">Marco Teórico — Conceptos Clave</div>
      <div style={{margin:'0 12px 8px',padding:'10px 12px',background:'var(--anton-light)',borderRadius:8,fontSize:12,color:'var(--anton)'}}>
        Tocá cada concepto para ver el resumen de campo y la explicación profunda.
      </div>
      {conceptos.map(c=>(
        <div className="teoria-card" key={c.id}>
          <div className="teoria-header" onClick={()=>toggle(c.id)}>
            <div style={{display:'flex',alignItems:'center',gap:10,flex:1}}>
              <span style={{fontSize:22}}>{c.icon}</span>
              <div>
                <div className="teoria-title">{c.title}</div>
                <span className="teoria-badge" style={{background:c.bc+'22',color:c.bc}}>{c.badge}</span>
              </div>
            </div>
            <span style={{fontSize:16,color:'var(--subtext)',marginLeft:8}}>{open[c.id]?'▲':'▼'}</span>
          </div>
          {open[c.id]&&(
            <div className="teoria-body">
              <div className="teoria-quick"><div className="teoria-quick-label">📌 Resumen de campo</div><div className="teoria-quick-text">{c.quick}</div></div>
              <div className="teoria-deep" style={{whiteSpace:'pre-line'}}>{c.deep}</div>
              {c.formula&&<div className="teoria-formula">{c.formula}</div>}
              <div className="teoria-ref-row">{c.refs.map(r=><span key={r} className="teoria-ref">{r}</span>)}</div>
            </div>
          )}
        </div>
      ))}
      <div style={{height:20}}/>
    </div>
  );
}

// ── Error Boundary ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(e){return{error:e};}
  componentDidCatch(e,i){console.error('[Anton]',e,i);}
  render(){
    if(this.state.error) return (
      <div style={{padding:32,textAlign:'center',color:'var(--sub)'}}>
        <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
        <div style={{fontSize:15,fontWeight:700,color:'var(--text)',marginBottom:8}}>
          Algo salió mal en esta pantalla
        </div>
        <div style={{fontSize:13,marginBottom:20}}>{this.state.error.message}</div>
        <button style={{padding:'10px 24px',background:'var(--anton)',color:'#fff',border:'none',
          borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:600}}
          onClick={()=>this.setState({error:null})}>Reintentar</button>
      </div>
    );
    return this.props.children;
  }
}

    camara:{label:'Cámara Frigorífica Media',copDefault:'2.5',densDefault:'1150'},
    baja:{label:'Cámara Baja Temperatura',copDefault:'1.8',densDefault:'1200'},
    bomba:{label:'Bomba de Calor',copDefault:'4.0',densDefault:'1060'},
  };
  React.useEffect(()=>{
    const p=appPresets[app];
    setCop(p.copDefault);
    setDensity(p.densDefault);
  },[app]);

  const kwNum=parseFloat(kw)||0;
  const copNum=parseFloat(cop)||3;
  const scNum=parseFloat(sc)||5;
  // Q_evap = kW_comp * COP; Q_cond = kW_comp * (COP+1)
  const Q_evap=kwNum*copNum;
  const Q_cond=kwNum*(copNum+1);
  // Mass flow: ṁ = Q_evap / (h_evap - h_liq)
  // Simplified: enthalpy diff ≈ 160 kJ/kg typical for HFCs at standard conditions
  const dH_approx=160; // kJ/kg
  const massFlow=Q_evap>0?(Q_evap/dH_approx*3600):0; // kg/hr
  // Charge estimate: based on typical system volume
  // Rule of thumb: 1.5–2.5 kg per kW for AC, varies
  const chargeFactors={ac:1.8,camara:2.2,baja:2.8,bomba:1.6};
  const chargeEst=kwNum*chargeFactors[app];

  return (
    <div className="content">
      <div className="bib-header">
        <div className="bib-title">Calculadora de Carga</div>
        <div className="bib-sub">Estimación de carga de gas refrigerante</div>
      </div>
      <div className="carga-section">
        <div className="carga-card">
          <div className="carga-title">Datos del sistema</div>
          <div className="carga-row">
            <span className="carga-label">Tipo de aplicación</span>
            <select className="carga-select" value={app} onChange={e=>setApp(e.target.value)}>
              {Object.entries(appPresets).map(([k,v])=>(
                <option key={k} value={k}>{v.label}</option>
              ))}
            </select>
          </div>
          <div className="carga-row">
            <span className="carga-label">Potencia compresor (kW)</span>
            <input className="carga-input" type="number" placeholder="ej: 5.5"
              value={kw} onChange={e=>setKw(e.target.value)}/>
          </div>
          <div className="carga-row">
            <span className="carga-label">COP estimado</span>
            <input className="carga-input" type="number" step="0.1" placeholder="3.5"
              value={cop} onChange={e=>setCop(e.target.value)}/>
          </div>
          <div className="carga-row">
            <span className="carga-label">Subcooling objetivo (°C)</span>
            <input className="carga-input" type="number" placeholder="5"
              value={sc} onChange={e=>setSc(e.target.value)}/>
          </div>
        </div>

        {kwNum>0?(
          <div>
            <div className="carga-result">
              <div className="carga-result-val">{chargeEst.toFixed(1)}</div>
              <div className="carga-result-unit">kg de refrigerante estimados</div>
              <div className="carga-result-sub">Estimación ±20% — verificar con cálculo detallado</div>
            </div>
            <div className="carga-grid" style={{marginTop:10}}>
              <div className="carga-mini">
                <div className="carga-mini-val">{Q_evap.toFixed(1)} kW</div>
                <div className="carga-mini-lbl">Capacidad frigorífica</div>
              </div>
              <div className="carga-mini">
                <div className="carga-mini-val">{Q_cond.toFixed(1)} kW</div>
                <div className="carga-mini-lbl">Calor de condensación</div>
              </div>
              <div className="carga-mini">
                <div className="carga-mini-val">{massFlow.toFixed(0)} kg/h</div>
                <div className="carga-mini-lbl">Flujo másico aprox.</div>
              </div>
              <div className="carga-mini">
                <div className="carga-mini-val">{(kwNum*(copNum+1)/kwNum).toFixed(2)}</div>
                <div className="carga-mini-lbl">Q_cond/W ratio</div>
              </div>
            </div>
            <div style={{background:'var(--anton-l)',borderRadius:10,padding:12,marginTop:10,fontSize:12,color:'var(--sub)',lineHeight:1.6}}>
              <strong style={{color:'var(--anton)'}}>⚠️ Nota:</strong> Esta es una estimación orientativa basada en 
              factores típicos por tipo de aplicación. La carga real depende del gas seleccionado, longitud de tuberías, 
              condiciones de diseño y especificaciones del fabricante del compresor.
            </div>
          </div>
        ):(
          <div className="empty">
            <div className="empty-icon">⚖️</div>
            <div className="empty-text">Ingresá la potencia del compresor<br/>para calcular la carga estimada</div>
          </div>
        )}
      </div>
    </div>
  );
}

function LoginScreen({onLogin,onRegister}){
  const [email,setEmail]=React.useState('');
  const [pass,setPass]=React.useState('');
  const [err,setErr]=React.useState('');
  const [loading,setLoading]=React.useState(false);

  const handleLogin=async()=>{
    setErr('');
    if(!email||!pass){setErr('Completá todos los campos.');return;}
    setLoading(true);
    try{
      const users=JSON.parse(localStorage.getItem('anton_users')||'[]');
      const hashed=await hashPass(pass);
      const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase()&&
        (x.password===hashed||x.password===pass)); // backward compat
      if(!u){setErr('Email o contraseña incorrectos.');setLoading(false);return;}
      onLogin({...u,password:undefined});
    }catch(e){setErr('Error al iniciar sesión.');}
    setLoading(false);
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <img src={LOGO_SRC} className="auth-logo" alt="Anton Company"/>
        <div className="auth-title">Bienvenido</div>
        <div className="auth-sub">Iniciá sesión para continuar</div>
        {err&&<div className="auth-error">{err}</div>}
        <div className="auth-field">
          <label className="auth-label">Email</label>
          <input className="auth-input" type="email" placeholder="tu@email.com"
            value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        </div>
        <div className="auth-field">
          <label className="auth-label">Contraseña</label>
          <input className="auth-input" type="password" placeholder="••••••••"
            value={pass} onChange={e=>setPass(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
        </div>
        <button className="auth-btn" onClick={handleLogin} disabled={loading}>
          {loading?'Verificando…':'Ingresar'}
        </button>
        <hr className="auth-divider"/>
        <div className="auth-link" onClick={onRegister}>
          ¿No tenés cuenta? <span>Registrarte</span>
        </div>
      </div>
    </div>
  );
}

function RegisterScreen({onBack,onRegistered}){
  const [form,setForm]=React.useState({name:'',email:'',company:'',role:'Técnico',password:'',confirm:''});
  const [err,setErr]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const handleRegister=async()=>{
    setErr('');
    if(!form.name||!form.email||!form.password){setErr('Completá nombre, email y contraseña.');return;}
    if(form.password!==form.confirm){setErr('Las contraseñas no coinciden.');return;}
    if(form.password.length<6){setErr('La contraseña debe tener al menos 6 caracteres.');return;}
    setLoading(true);
    try{
      const users=JSON.parse(localStorage.getItem('anton_users')||'[]');
      if(users.find(x=>x.email.toLowerCase()===form.email.toLowerCase())){
        setErr('Ese email ya está registrado.');setLoading(false);return;
      }
      const hashed=await hashPass(form.password);
      const u={name:form.name,email:form.email,company:form.company,role:form.role,password:hashed};
      users.push(u);
      localStorage.setItem('anton_users',JSON.stringify(users));
      onRegistered({...u,password:undefined});
    }catch(e){setErr('Error al registrarse.');}
    setLoading(false);
  };

  return (
    <div className="auth-screen" style={{overflowY:'auto',justifyContent:'flex-start',paddingTop:32,paddingBottom:32}}>
      <div className="auth-card">
        <img src={LOGO_SRC} className="auth-logo" alt="Anton Company"/>

        <div className="auth-field">

          <input className="auth-input" type="text" placeholder="Empresa S.A."
            value={form.company} onChange={set('company')}/>
        </div>
        <div className="auth-field">
          <label className="auth-label">Perfil</label>
          <select className="auth-select" value={form.role} onChange={set('role')}>
            <option>Técnico</option>
            <option>Técnico Senior</option>
            <option>Ingeniero</option>

        </div>
        <div className="auth-field">
          <label className="auth-label">Contraseña</label>
          <input className="auth-input" type="password" placeholder="Mínimo 6 caracteres"
            value={form.password} onChange={set('password')}/>

        <div className="auth-field">

          <input className="auth-input" type="password" placeholder="Repetí la contraseña"
